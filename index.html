<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Einaudi Plus</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e11d2a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Einaudi Plus" />
    <!--
      I font sono ospitati da noi: le regole @font-face stanno in style.css.
      Prima qui c'era un <link> a fonts.googleapis.com, che a ogni apertura
      mandava a Google l'indirizzo IP di chi apriva l'app.

      Questi due preload sono i sottoinsiemi "latin", gli unici che servono
      quasi sempre: senza, il browser li scopre solo dopo aver scaricato e
      letto il CSS, e il testo resta un attimo col font di sistema. `crossorigin`
      è obbligatorio anche per file nostri — i font si richiedono sempre in
      modalità anonima, e senza quell'attributo il browser scaricherebbe due
      volte lo stesso file.
    -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
